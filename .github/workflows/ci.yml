name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Lint source and tests
        run: npm run lint

      - name: Run automated tests
        run: npm test

  firebase-integration:
    name: Verify Firebase adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use the project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: npm

      - name: Use Java 21 for Firebase emulators
        uses: actions/setup-java@7a445ee88d4e23b52c33b9b520e7bfea7d65d620
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run Firebase emulator integration tests
        run: npm run test:firebase
